<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resumo CFO v8 — Fluxo de caixa por conta</title>
<style>

a{color:#009cde}a:hover{color:#ffffff}
*{box-sizing:border-box;scrollbar-color:rgba(255,255,255,0.2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.08);color:#cccfcf}
/* ---- v6: briefing do dia ---- */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes giro{to{--ang:360deg}}
@keyframes pulso{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
@keyframes onda{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fala{0%,100%{height:4px}50%{height:14px}}
.brief{position:relative;border-radius:16px;padding:1px;background:conic-gradient(from var(--ang),rgba(0,156,222,.9),rgba(63,156,53,.5),rgba(0,156,222,.08) 40%,rgba(0,156,222,.08) 70%,rgba(0,156,222,.9));animation:giro 8s linear infinite}
.brief-in{border-radius:15px;background:radial-gradient(1200px 300px at 0% 0%,rgba(0,156,222,.16),transparent 60%),#07173d;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.nucleo{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#5fd0ff 0 18%,#009cde 19% 34%,rgba(0,156,222,.18) 35% 100%);box-shadow:0 0 24px rgba(0,156,222,.55)}
.nucleo::before,.nucleo::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,156,222,.6);animation:onda 2.6s ease-out infinite}
.nucleo::after{animation-delay:1.3s}
.nucleo.alerta{background:radial-gradient(circle,#ff9ab2 0 18%,#E40046 19% 34%,rgba(228,0,70,.18) 35% 100%);box-shadow:0 0 24px rgba(228,0,70,.5)}
.nucleo.alerta::before,.nucleo.alerta::after{border-color:rgba(228,0,70,.6)}
.linha-b{animation:entra .45s ease-out both}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.08em}
.barras{display:inline-flex;gap:2px;align-items:center;height:14px}
.barras i{display:block;width:3px;border-radius:2px;background:#ffffff;animation:fala .9s ease-in-out infinite}
.barras i:nth-child(2){animation-delay:.15s}.barras i:nth-child(3){animation-delay:.3s}.barras i:nth-child(4){animation-delay:.45s}
@media (prefers-reduced-motion:reduce){.brief,.nucleo::before,.nucleo::after,.linha-b,.barras i{animation:none}}
@media print{.brief{background:#009cde}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}button,label,select,input,textarea{display:none !important}}
</style>

<style>
/* ===================== tokens de tema ===================== */
.tema-claro{--bg:#f4f4f4;--card:#ffffff;--line:#e5e6e6;--line-strong:#cccfcf;--ink:#3f4145;--ink-2:#63666a;--muted:#888b8d;
  --accent:#009cde;--accent-hover:#006e9d;--c1:#009cde;--c2:#3f9c35;--pos:#3f9c35;--pos-ink:#2d7a25;--neg:#E40046;--neg-ink:#c2003c;
  --warn:#F1B434;--warn-ink:#8f5f00;--focus:rgba(0,156,222,.09);--sel:#eef8fd;--grid:#efefef;--axis:#d9dbdb;--chip-bg:#f0f0f0;
  --chip-on-bg:#00153D;--chip-on-fg:#ffffff;--neg-bg:rgba(228,0,70,.07);--warn-bg:rgba(241,180,52,.16);--pos-bg:rgba(63,156,53,.10);
  --tip-bg:#00153D;--seg-bg:#e9eaea;--seg-on:#ffffff;--seg-on-ink:#00153D}
.tema-escuro{--bg:#00153D;--card:#0a1e45;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.18);--ink:#ffffff;--ink-2:#cccfcf;--muted:#888b8d;
  --accent:#009cde;--accent-hover:#33b0e5;--c1:#009cde;--c2:#3f9c35;--pos:#3f9c35;--pos-ink:#7fc47a;--neg:#E40046;--neg-ink:#ff6b8f;
  --warn:#F1B434;--warn-ink:#F1B434;--focus:rgba(0,156,222,.16);--sel:#13295a;--grid:rgba(255,255,255,.06);--axis:rgba(255,255,255,.3);--chip-bg:rgba(255,255,255,.07);
  --chip-on-bg:#ffffff;--chip-on-fg:#00153D;--neg-bg:rgba(228,0,70,.16);--warn-bg:rgba(241,180,52,.14);--pos-bg:rgba(63,156,53,.18);
  --tip-bg:#000d26;--seg-bg:rgba(255,255,255,.06);--seg-on:rgba(255,255,255,.14);--seg-on-ink:#ffffff}

/* ===================== base ===================== */
html,body{margin:0;background:#f4f4f4}
body{font-family:Prelo,"Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
.tx2{color:var(--ink-2)}
.neg{color:var(--neg-ink)}
.flex1{flex:1}
b{font-weight:600}
h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:600;letter-spacing:-.01em;color:var(--ink)}
h2{margin:0;font-size:16px;font-weight:600;color:var(--ink)}
.sub{font-size:13px;color:var(--muted)}
.nota{font-size:12px;color:var(--muted)}
p{margin:0}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;margin:0 2px;border-radius:4px;background:var(--chip-bg);color:var(--ink-2)}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}

/* ===================== barra superior ===================== */
.topbar{background:#00153D;color:#ffffff;position:sticky;top:0;z-index:30}
.topbar-in{max-width:1320px;margin:0 auto;padding:12px clamp(16px,3vw,40px);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px;font-size:14px}
.marca strong{letter-spacing:.02em}
.marca .sep{width:1px;height:16px;background:rgba(255,255,255,.25)}
.marca-sub{color:#cccfcf}
.pbar{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.pbar i{display:block;width:4px;border-radius:1px}
.pbar i:nth-child(1){height:8px;background:#888b8d}.pbar i:nth-child(2){height:12px;background:#3f9c35}.pbar i:nth-child(3){height:16px;background:#009cde}
.pbar-grande{height:40px;gap:6px}.pbar-grande i{width:10px}
.pbar-grande i:nth-child(1){height:20px}.pbar-grande i:nth-child(2){height:30px}.pbar-grande i:nth-child(3){height:40px}
.acoes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.status{display:flex;align-items:center;gap:8px;border:none;background:none;color:#cccfcf;font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px}
.status:hover{color:#ffffff}
.status .dot{width:8px;height:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;font:inherit;font-size:13px;font-weight:500;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn-primario{background:#009cde;color:#ffffff}.btn-primario:hover{background:#006e9d}
.btn-ghost{background:var(--chip-bg);color:var(--ink)}.btn-ghost:hover{background:var(--line-strong)}
.topbar .btn-ghost{background:rgba(255,255,255,.08);color:#ffffff}.topbar .btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-icone{padding:8px 10px;min-width:36px;justify-content:center}
.btn-link{background:none;color:var(--accent);padding:4px 0;font-weight:600}.btn-link:hover{color:var(--accent-hover)}
.play{width:0;height:0;border-left:8px solid #ffffff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted)}

/* ===================== página ===================== */
main.wrap{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:28px;padding-bottom:40px}
.pagina-topo{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin-top:6px}
.meta b{color:var(--ink)}
.segmentado{display:flex;padding:3px;border-radius:10px;background:var(--seg-bg);gap:2px;flex-wrap:wrap}
.segmentado button{border:none;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.segmentado button.on{background:var(--seg-on);color:var(--seg-on-ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.destaque{border-color:var(--accent)}
.card-topo{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-topo > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-rodape{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.linha-h{display:flex !important;flex-direction:row !important;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#ffffff;background:var(--accent)}

/* avisos */
.aviso{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:13px;line-height:1.45}
.aviso .dot{background:var(--warn);margin-top:6px}
.aviso-linha{display:flex;gap:10px;align-items:flex-start}
.aviso-erro{flex-direction:row;gap:10px;align-items:flex-start;background:var(--neg-bg)}
.aviso-erro .dot{background:var(--neg)}
.aviso-acao{align-items:center;flex-wrap:wrap}
.aviso-acao .dot{margin-top:0}
.aviso-texto{font-size:13px;color:var(--warn-ink)}

/* vazio */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:52vh;border:2px dashed var(--line-strong);border-radius:16px;padding:40px 24px;cursor:pointer;background:var(--card)}
.vazio:hover{border-color:var(--accent)}
.vazio-titulo{font-size:22px;color:var(--ink)}
.vazio-texto{font-size:14px;color:var(--ink-2);max-width:520px;line-height:1.5}

/* ===================== insights ===================== */
.insights{display:flex;flex-direction:column;gap:12px}
.container-msg{position:relative;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:22px 26px;border-radius:12px;background:#00153D;color:#ffffff;overflow:hidden}
.container-msg.alerta{background:#00153D}
.container-msg.ok{background:#3f9c35}
.container-msg-in{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px;position:relative}
.container-msg .rotulo{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#cccfcf}
.container-msg.ok .rotulo{color:#ffffff}
.manchete{font-size:clamp(19px,2.2vw,26px);font-weight:600;line-height:1.3}
.pp{position:absolute;display:flex;gap:3px}
.pp i{display:block;width:10px;height:10px}
.pp-tr{top:0;right:0}.pp-tr i:nth-child(1){background:#3f9c35}.pp-tr i:nth-child(2){background:#009cde}
.pp-bl{bottom:0;left:0}.pp-bl i:nth-child(1){background:#888b8d}.pp-bl i:nth-child(2){background:#3f9c35}
.container-msg.ok .pp-tr i:nth-child(1){background:#009cde}.container-msg.ok .pp-tr i:nth-child(2){background:#00153D}
.container-msg.ok .pp-bl i:nth-child(2){background:#009cde}
.btn-recolher{position:relative;border:none;background:rgba(255,255,255,.12);color:#ffffff;font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer}
.btn-recolher:hover{background:rgba(255,255,255,.22)}
.insights-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.insight{gap:8px;padding:16px 18px}
.insight p{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.insight-titulo{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.marcador{display:inline-block;flex:none;width:8px;height:8px;border-radius:2px}
.insight .btn-link{align-self:flex-start;margin-top:auto}
.insights-fechado{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font:inherit;font-size:14px;text-align:left;padding:12px 16px;border-radius:12px;cursor:pointer}
.insights-fechado:hover{border-color:var(--accent)}
.insights-fechado .rotulo{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}

/* ===================== KPIs ===================== */
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px}
.kpi{gap:6px;position:relative;padding:18px 20px}
.kpi-rotulo{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.kpi-valor{font-size:26px;font-weight:600;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-hero .kpi-valor{font-size:clamp(34px,3.6vw,46px)}
.kpi-hero{background:var(--card);border-top:3px solid #009cde}
.kpi-sub{font-size:12.5px;color:var(--muted)}
.spark{width:100%;height:32px;display:block;margin-top:4px}
.chave{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
.chave-c1{background:var(--c1)}
.chave-c2{background:repeating-linear-gradient(90deg,var(--c2) 0 4px,transparent 4px 6px)}
.legenda{display:flex !important;flex-direction:row !important;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legenda > span{display:inline-flex;align-items:center;gap:6px}

/* ===================== gráficos ===================== */
.grade-graficos{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px}
.coluna{display:flex;flex-direction:column;gap:12px;min-width:0}
.grafico{width:100%;height:auto;display:block;font-family:inherit;overflow:visible}
.eixo{font-size:12px;fill:var(--muted)}
.eixo-g{font-size:18px}
.tip-t{font-size:13px;font-weight:600;fill:#ffffff}
.tip-l{font-size:13px;fill:#cccfcf}
.tip-v{font-weight:600;fill:#ffffff}
.tip-h{font-size:11px;fill:#5fc3ee}
.ponte{display:flex;flex-direction:column;gap:12px}
.ponte-linha{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.ponte-rotulo{color:var(--ink-2)}
.ponte-trilho{position:relative;height:14px}
.ponte-barra{position:absolute;top:0;bottom:0;border-radius:4px;min-width:2px}
.ponte-valor{font-weight:600;text-align:right;min-width:92px}
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.faixa > div{display:flex;flex-direction:column;gap:3px}
.faixa b{font-size:18px}
.faixa small{font-size:12px;color:var(--muted)}
.tema-escuro .container-msg.alerta{background:#009cde}
.tema-escuro .container-msg.alerta .rotulo{color:#ffffff}
.tema-escuro .container-msg.alerta .pp-tr i:nth-child(2){background:#00153D}
.bancos{display:flex;flex-direction:column;gap:12px}
.banco-cab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.banco-trilho{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.banco-trilho span{display:block;height:100%;border-radius:4px;background:#009cde}

/* ===================== tabela ===================== */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:none;padding:6px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip-foco{background:var(--accent) !important;color:#ffffff !important}
.chip-grande{padding:9px 18px;font-weight:600}
.divisor{width:1px;height:20px;background:var(--line-strong)}
.campo{background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;min-width:0}
.campo:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.tabela-wrap{overflow-x:auto}
.tabela{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}
.tabela th{position:sticky;top:0;text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.tabela th.num,.tabela td.num{text-align:right}
.th-dia{cursor:pointer;border-radius:6px 6px 0 0}
.tabela td{padding:11px 8px;border-bottom:1px solid var(--line);color:var(--ink)}
.linha{cursor:pointer}
.linha:hover td{background-color:var(--sel)}
.col-conta{position:sticky;left:0;z-index:1;background:var(--card)}
.conta{display:flex;align-items:center;gap:10px}
.conta b{display:block;font-weight:600}
.conta small,.cartao small{display:block;font-size:12px;color:var(--muted)}
.conta em,.cartao em{font-style:normal;color:var(--accent)}
.acento{flex:none;width:3px;height:30px;border-radius:2px}
.spark-linha{width:84px;height:28px;display:block}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500}
.decisao{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.total td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:none}
.cartoes{display:flex;flex-direction:column;gap:8px}
.cartao{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;background:var(--card);color:var(--ink)}
.cartao .spark-linha{width:100%}
.cartao-topo,.cartao-rodape{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%}
.cartao-valor{text-align:right}
.cartao-total{display:flex;justify-content:space-between;padding:10px 4px;font-weight:600}

/* ===================== listas / simulação ===================== */
.lista{display:flex;flex-direction:column}
.lista-linha{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.seta{color:var(--accent)}
.sim{display:flex;flex-direction:column;gap:12px}
.sim-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.rotulo-campo{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2);min-width:0}
.rotulo-campo .campo{width:100%;padding:9px 11px;font-size:14px}

/* ===================== gaveta de detalhe ===================== */
.veu{position:fixed;inset:0;background:rgba(0,21,61,.45);z-index:40}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.gaveta-titulo{font-size:22px}
.gaveta-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.gaveta-kpis > div{display:flex;flex-direction:column;gap:3px}
.gaveta-kpis b{font-size:20px}
.gaveta-kpis small{font-size:12px;color:var(--muted)}
.dia-linha{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.dia-linha span:not(:first-child){text-align:right;min-width:110px}
.decisao-bloco{display:flex;flex-direction:column;gap:10px}
.decisao-bloco textarea{width:100%;resize:vertical;font-size:14px}

.soltar{position:fixed;inset:0;z-index:80;background:rgba(0,21,61,.85);display:flex;align-items:center;justify-content:center;pointer-events:none}
.soltar span{font-size:24px;color:#ffffff;padding:32px 48px;border:2px dashed #009cde;border-radius:16px}

/* ===================== rodapé ===================== */
.rodape{border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--muted)}
.rodape-in{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.rodape b{color:var(--ink-2)}

/* ===================== responsivo ===================== */
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.grade-graficos{grid-template-columns:1fr}}
@media (max-width:640px){.kpis{grid-template-columns:1fr}.marca-sub,.marca .sep,.atalhos{display:none}.topbar{position:static}
  .acoes .btn-ghost:not(.btn-icone){display:none}.segmentado{width:100%}.segmentado button{flex:1;padding:7px 8px}
  .card{padding:16px}.container-msg{padding:20px}}
@media print{.topbar{position:static}.acoes,.filtros,.btn,.btn-recolher,textarea{display:none !important}
  body,.app{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style>
/* ---- v8: modos administrador / executivo ---- */
.btn-exportar{background:#3f9c35;color:#ffffff}.btn-exportar:hover{background:#2d7a25}
.selo{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#cccfcf;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08)}
.selo .dot{background:#3f9c35}
.selo.velho .dot{background:#F1B434}
.aviso-ok{flex-direction:row;gap:10px;align-items:flex-start;background:var(--pos-bg)}
.aviso-ok .dot{background:var(--pos)}
</style>
</head>

<!-- Resumo CFO v8 · RSM Brasil · Tesouraria/FP&A
     Arquivo único: abre direto no navegador ou pelo GitHub Pages.
     A planilha é lida localmente (arrastar e soltar) e nunca sai do navegador. -->
<script type="text/x-dc-template" id="dc-template"><div class="app {{ themeClass }}">

  <!-- ===================== barra superior ===================== -->
  <header class="topbar">
    <div class="topbar-in">
      <div class="marca">
        <span class="pbar"><i></i><i></i><i></i></span>
        <strong>RSM Brasil</strong><span class="sep"></span><span class="marca-sub">Tesouraria · Resumo CFO</span>
      </div>
      <div class="acoes">
        <sc-if value="{{ isAdmin }}">
          <button class="status" onClick="{{ reload }}" title="Carregar outra planilha"><span class="dot" style="background:{{ statusDot }}"></span>{{ statusText }}</button>
          <label class="btn btn-ghost">Carregar arquivo<input id="dc-file" type="file" accept=".xlsx,.xlsm" onChange="{{ onFile }}" style="display:none"></label>
        </sc-if>
        <sc-if value="{{ isExec }}">
          <span class="{{ selo.cls }}" title="{{ selo.title }}"><span class="dot"></span>{{ selo.txt }}</span>
        </sc-if>
        <sc-if value="{{ canExport }}">
          <button class="btn btn-exportar" onClick="{{ exportarPainel }}" title="Gera um HTML com os dados embutidos para o CFO abrir direto">Baixar painel com dados</button>
        </sc-if>
        <button class="btn btn-ghost" onClick="{{ copyLink }}">{{ copyLabel }}</button>
        <button class="btn btn-ghost" onClick="{{ printPage }}">PDF</button>
        <button class="btn btn-ghost btn-icone" onClick="{{ toggleTheme }}" title="{{ themeLabel }}">{{ themeIcon }}</button>
        <button class="btn btn-primario" onClick="{{ startPresent }}"><span class="play"></span>Apresentar</button>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- ===================== cabeçalho da página ===================== -->
    <div class="pagina-topo">
      <div>
        <h1>Posição de caixa</h1>
        <div class="meta">
          <span>Referência <b>{{ refDate }}</b></span>
          <span>Período <b>{{ period }}</b></span>
          <span>{{ kpiAccounts }}</span>
        </div>
      </div>
      <sc-if value="{{ hasData }}">
        <div class="segmentado" role="tablist">
          <button class="{{ seg1 }}" onClick="{{ setC1 }}">Com recebimentos</button>
          <button class="{{ seg2 }}" onClick="{{ setC2 }}">Só saídas</button>
          <button class="{{ seg3 }}" onClick="{{ setC3 }}">Efeito dos recebimentos</button>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ hasExportMsg }}">
      <div class="aviso aviso-ok"><span class="dot"></span><span>{{ exportMsg }}</span></div>
    </sc-if>
    <sc-if value="{{ hasStaleMsg }}">
      <div class="aviso"><div class="aviso-linha"><span class="dot"></span><span>{{ staleMsg }}</span></div></div>
    </sc-if>
    <sc-if value="{{ hasError }}">
      <div class="aviso aviso-erro"><span class="dot"></span><span>{{ errText }}</span></div>
    </sc-if>

    <!-- ===================== tela vazia ===================== -->
    <sc-if value="{{ showEmpty }}">
      <label class="vazio">
        <span class="pbar pbar-grande"><i></i><i></i><i></i></span>
        <span class="vazio-titulo">Arraste a <b>Financeiro.xlsx</b> aqui</span>
        <span class="vazio-texto">ou clique para escolher o arquivo. A planilha é lida só neste navegador: nada é enviado para a internet. Antes de carregar, recalcule (Ctrl+Alt+F9) e salve no Excel.</span>
        <span class="btn btn-primario">Escolher arquivo</span>
        <input type="file" accept=".xlsx,.xlsm" onChange="{{ onFile }}" style="display:none">
      </label>
    </sc-if>

    <sc-if value="{{ hasData }}">

      <!-- ===================== insights do dia ===================== -->
      <sc-if value="{{ brief.open }}">
        <section class="insights">
          <div class="container-msg {{ brief.msgClass }}">
            <span class="pp pp-tr"><i></i><i></i></span>
            <span class="pp pp-bl"><i></i><i></i></span>
            <div class="container-msg-in">
              <span class="rotulo">Insights do dia · {{ brief.stamp }}</span>
              <span class="manchete">{{ brief.headline }}</span>
            </div>
            <button class="btn-recolher" onClick="{{ brief.onClose }}" title="Recolher (B)">Recolher</button>
          </div>
          <div class="insights-grade">
            <sc-for list="{{ brief.blocks }}" as="b">
              <article class="card insight">
                <span class="insight-titulo"><span class="marcador" style="background:{{ b.color }}"></span>{{ b.title }}</span>
                <sc-for list="{{ b.lines }}" as="l"><p>{{ l }}</p></sc-for>
                <sc-if value="{{ b.hasAction }}">
                  <button class="btn btn-link" onClick="{{ b.onAction }}">{{ b.actionLabel }} →</button>
                </sc-if>
              </article>
            </sc-for>
          </div>
        </section>
      </sc-if>
      <sc-if value="{{ brief.closed }}">
        <button class="insights-fechado" onClick="{{ brief.onOpen }}">
          <span class="marcador" style="background:{{ brief.dotColor }}"></span>
          <span class="rotulo">Insights do dia</span>
          <span>{{ brief.headline }}</span>
        </button>
      </sc-if>

      <sc-if value="{{ hasAlerts }}">
        <div class="aviso">
          <sc-for list="{{ alerts }}" as="a"><div class="aviso-linha"><span class="dot"></span><span>{{ a }}</span></div></sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ showRiskBanner }}">
        <div class="aviso aviso-erro aviso-acao">
          <span class="dot"></span>
          <span class="flex1"><b>{{ att.negAccounts }} de {{ nAccounts }} contas</b> ficam descobertas sem recebimentos. Pior caso: <b>{{ kpi.worst }}</b> em {{ kpi.worstWhere }}.</span>
          <button class="btn btn-ghost" onClick="{{ showNeg }}">Ver contas negativas</button>
          <button class="btn btn-primario" onClick="{{ openSuggest }}">Sugerir cobertura</button>
        </div>
      </sc-if>

      <!-- ===================== sugestão de cobertura ===================== -->
      <sc-if value="{{ suggestOpen }}">
        <section class="card destaque">
          <div class="card-topo">
            <div>
              <h2>Sugestão de cobertura · {{ sug.scLabel }}</h2>
              <span class="sub">Transferências a partir de hoje, de contas com sobra no período inteiro para contas negativas{{ sug.minNote }}.</span>
            </div>
            <button class="btn btn-ghost" onClick="{{ closeSuggest }}">Fechar</button>
          </div>
          <sc-if value="{{ sug.hasList }}">
            <div class="lista">
              <sc-for list="{{ sug.list }}" as="t">
                <div class="lista-linha"><b class="num">{{ t.amount }}</b><span class="tx2">{{ t.from }}</span><span class="seta">→</span><span>{{ t.to }}</span></div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ sug.empty }}"><p>Nenhuma conta tem sobra no período inteiro para transferir.</p></sc-if>
          <div class="card-rodape">
            <div class="meta">
              <span>Contas negativas <b>{{ sug.before }} → {{ sug.after }}</b></span>
              <sc-if value="{{ sug.hasGap }}"><span>Ainda falta cobrir <b class="neg">{{ sug.gap }}</b> (aporte ou captação)</span></sc-if>
            </div>
            <sc-if value="{{ sug.hasList }}"><button class="btn btn-primario" onClick="{{ applySuggest }}">Aplicar na simulação</button></sc-if>
          </div>
        </section>
      </sc-if>

      <!-- ===================== indicadores ===================== -->
      <section class="kpis">
        <article class="card kpi kpi-hero">
          <span class="kpi-rotulo">Saldo consolidado hoje</span>
          <span class="kpi-valor">{{ kpi.today }}</span>
          <span class="kpi-sub">{{ nAccounts }} contas · {{ v7.bancosResumo }}</span>
        </article>
        <article class="card kpi">
          <span class="kpi-rotulo"><span class="chave chave-c1"></span>Em {{ endLabel }} · com recebimentos</span>
          <span class="kpi-valor" style="color:{{ kpi.c1Color }}">{{ kpi.c1End }}</span>
          <span class="kpi-sub" style="color:{{ kpi.c1DeltaColor }}">{{ kpi.c1Delta }} vs hoje</span>
          <svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline points="{{ v7.sparkC1 }}" style="fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"></polyline></svg>
        </article>
        <article class="card kpi">
          <span class="kpi-rotulo"><span class="chave chave-c2"></span>Em {{ endLabel }} · só saídas</span>
          <span class="kpi-valor" style="color:{{ kpi.c2Color }}">{{ kpi.c2End }}</span>
          <span class="kpi-sub" style="color:{{ kpi.c2DeltaColor }}">{{ kpi.c2Delta }} vs hoje</span>
          <svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline points="{{ v7.sparkC2 }}" style="fill:none;stroke:var(--c2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"></polyline></svg>
        </article>
        <article class="card kpi">
          <span class="kpi-rotulo">Aguardando pagamento</span>
          <span class="kpi-valor">{{ kpi.awaiting }}</span>
          <span class="kpi-sub">{{ att.negCount }} dias-conta negativos sem recebimentos · {{ tally.done }}/{{ nAll }} contas com decisão</span>
        </article>
      </section>

      <!-- ===================== gráficos ===================== -->
      <section class="grade-graficos">
        <article class="card">
          <div class="card-topo">
            <div>
              <h2>Saldo consolidado projetado</h2>
              <span class="sub">Clique num dia para focar a tabela.</span>
            </div>
            <div class="legenda">
              <span><span class="chave chave-c1"></span>Com recebimentos</span>
              <span><span class="chave chave-c2"></span>Só saídas</span>
            </div>
          </div>
          <svg class="grafico" viewBox="0 0 880 250" onMouseLeave="{{ clearHover }}">
            <sc-for list="{{ chart.ticks }}" as="t">
              <line x1="90" x2="865" y1="{{ t.y }}" y2="{{ t.y }}" style="stroke:{{ t.stroke }};stroke-width:1"></line>
              <text x="80" y="{{ t.ty }}" text-anchor="end" class="eixo">{{ t.label }}</text>
            </sc-for>
            <sc-if value="{{ focus.has }}">
              <rect x="{{ focus.bx }}" y="10" width="{{ focus.bw }}" height="206" rx="6" style="fill:var(--focus)"></rect>
            </sc-if>
            <polygon points="{{ chart.a1 }}" style="fill:var(--c1);fill-opacity:.10"></polygon>
            <polyline points="{{ chart.c2 }}" style="fill:none;stroke:var(--c2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 5"></polyline>
            <polyline points="{{ chart.c1 }}" style="fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"></polyline>
            <sc-for list="{{ chart.pts }}" as="p">
              <text x="{{ p.x }}" y="{{ p.ly }}" text-anchor="middle" class="eixo" style="fill:{{ p.lc }};font-weight:{{ p.lw }}">{{ p.label }}</text>
            </sc-for>
            <sc-if value="{{ hasTip }}">
              <line x1="{{ tip.x }}" x2="{{ tip.x }}" y1="16" y2="210" style="stroke:var(--axis);stroke-width:1"></line>
              <circle cx="{{ tip.x }}" cy="{{ tip.y2 }}" r="5" style="fill:var(--c2);stroke:var(--card);stroke-width:2"></circle>
              <circle cx="{{ tip.x }}" cy="{{ tip.y1 }}" r="5" style="fill:var(--c1);stroke:var(--card);stroke-width:2"></circle>
              <rect x="{{ tip.bx }}" y="18" width="236" height="114" rx="8" style="fill:var(--tip-bg)"></rect>
              <text x="{{ tip.tx }}" y="42" class="tip-t">{{ tip.label }}</text>
              <text x="{{ tip.tx }}" y="64" class="tip-l">Com recebimentos <tspan class="tip-v">{{ tip.v1 }}</tspan></text>
              <text x="{{ tip.tx }}" y="84" class="tip-l">Só saídas <tspan class="tip-v">{{ tip.v2 }}</tspan></text>
              <text x="{{ tip.tx }}" y="104" class="tip-l">Recebimentos <tspan class="tip-v">{{ tip.diff }}</tspan></text>
              <text x="{{ tip.tx }}" y="124" class="tip-h">{{ tip.hint }}</text>
            </sc-if>
            <sc-for list="{{ chart.pts }}" as="p">
              <rect x="{{ p.hx }}" y="0" width="{{ p.hw }}" height="250" style="fill:transparent;cursor:pointer" onMouseEnter="{{ p.onEnter }}" onClick="{{ p.onClick }}"></rect>
            </sc-for>
          </svg>
          <div class="faixa">
            <sc-for list="{{ v7.faixa }}" as="f">
              <div><span class="kpi-rotulo">{{ f.label }}</span><b class="num" style="color:{{ f.ink }}">{{ f.txt }}</b><small>{{ f.sub }}</small></div>
            </sc-for>
          </div>
        </article>

        <div class="coluna">
          <article class="card">
            <div class="card-topo"><div><h2>Ponte do saldo</h2><span class="sub">De hoje até {{ endLabel }}, consolidado</span></div></div>
            <div class="ponte">
              <sc-for list="{{ v7.ponte }}" as="w">
                <div class="ponte-linha">
                  <span class="ponte-rotulo">{{ w.label }}</span>
                  <div class="ponte-trilho"><span class="ponte-barra" style="left:{{ w.left }};width:{{ w.width }};background:{{ w.color }}"></span></div>
                  <span class="ponte-valor num" style="color:{{ w.ink }}">{{ w.txt }}</span>
                </div>
              </sc-for>
            </div>
          </article>
          <article class="card">
            <div class="card-topo"><div><h2>Saldo hoje por banco</h2><span class="sub">Participação no consolidado</span></div></div>
            <div class="bancos">
              <sc-for list="{{ v7.bancos }}" as="k">
                <div class="banco-linha">
                  <div class="banco-cab"><span>{{ k.label }}</span><span class="num tx2">{{ k.txt }} · {{ k.pct }}</span></div>
                  <div class="banco-trilho"><span style="width:{{ k.width }}"></span></div>
                </div>
              </sc-for>
            </div>
          </article>
        </div>
      </section>

      <!-- ===================== contas ===================== -->
      <section class="card">
        <div class="card-topo">
          <div>
            <h2>Saldo projetado por conta</h2>
            <span class="sub">{{ scenarioDesc }}</span>
          </div>
        </div>
        <div class="filtros">
          <sc-for list="{{ bankChips }}" as="b">
            <button class="chip" onClick="{{ b.onClick }}" style="background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button>
          </sc-for>
          <span class="divisor"></span>
          <button class="chip" onClick="{{ toggleNeg }}" style="background:{{ negBtn.bg }};color:{{ negBtn.fg }}">Só negativas</button>
          <sc-if value="{{ focus.has }}">
            <button class="chip chip-foco" onClick="{{ clearDay }}">Dia em foco: {{ focus.label }} ×</button>
          </sc-if>
          <span class="flex1"></span>
          <select class="campo" value="{{ sortBy }}" onChange="{{ onSort }}">
            <option value="planilha">Ordem da planilha</option>
            <option value="negativa">Fica negativa primeiro</option>
            <option value="pior">Pior saldo</option>
            <option value="hoje">Maior saldo hoje</option>
            <option value="dia">Saldo no dia em foco</option>
          </select>
          <input class="campo" type="text" inputMode="decimal" placeholder="Saldo mínimo (R$)" value="{{ minBal }}" onChange="{{ onMinBal }}" style="width:170px">
        </div>

        <sc-if value="{{ showTable }}">
          <div class="tabela-wrap">
            <table class="tabela">
              <thead>
                <tr>
                  <th class="col-conta">Conta</th>
                  <th>Tendência</th>
                  <th>Situação</th>
                  <th class="num th-dia" onClick="{{ todayTh.onClick }}" style="color:{{ todayTh.fg }};background:{{ todayTh.bg }}">Hoje</th>
                  <sc-for list="{{ dateCols }}" as="d">
                    <th class="num th-dia" onClick="{{ d.onClick }}" style="color:{{ d.fg }};background:{{ d.bg }}">{{ d.label }}</th>
                  </sc-for>
                  <th>Decisão</th>
                </tr>
              </thead>
              <tbody>
                <sc-for list="{{ rows }}" as="r">
                  <tr class="linha" onClick="{{ r.onSelect }}" style="background:{{ r.rowBg }}">
                    <td class="col-conta" style="background:{{ r.nameBg }}">
                      <div class="conta"><span class="acento" style="background:{{ r.accent }}"></span><div><b>{{ r.bank }}</b><small>{{ r.acct }}<em>{{ r.simNote }}</em></small></div></div>
                    </td>
                    <td><svg class="spark-linha" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" x2="100" y1="{{ r.sparkZero }}" y2="{{ r.sparkZero }}" style="stroke:var(--axis);stroke-width:1;vector-effect:non-scaling-stroke"></line><polyline points="{{ r.spark }}" style="fill:none;stroke:{{ r.sparkColor }};stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke"></polyline></svg></td>
                    <td><span class="pill" style="color:{{ r.statusFg }};background:{{ r.statusBg }}">{{ r.status }}</span></td>
                    <td class="num" style="background:{{ r.todayBg }}">{{ r.today }}</td>
                    <sc-for list="{{ r.cells }}" as="c">
                      <td class="num" style="color:{{ c.fg }};background:{{ c.bg }}">{{ c.txt }}</td>
                    </sc-for>
                    <td><span class="decisao" style="color:{{ r.markFg }}"><span class="dot" style="background:{{ r.markDot }}"></span>{{ r.mark }}</span></td>
                  </tr>
                </sc-for>
                <tr class="total">
                  <td class="col-conta">Total</td>
                  <td></td><td></td>
                  <td class="num" style="background:{{ total.todayBg }}">{{ total.today }}</td>
                  <sc-for list="{{ total.cells }}" as="c">
                    <td class="num" style="color:{{ c.fg }};background:{{ c.bg }}">{{ c.txt }}</td>
                  </sc-for>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </sc-if>

        <sc-if value="{{ showCards }}">
          <div class="cartoes">
            <sc-for list="{{ rows }}" as="r">
              <button class="cartao" onClick="{{ r.onSelect }}">
                <div class="cartao-topo">
                  <div><b>{{ r.bank }}</b><small>{{ r.acct }}<em>{{ r.simNote }}</em></small></div>
                  <div class="cartao-valor"><small>{{ r.cardLabel }}</small><b class="num" style="color:{{ r.cardFg }}">{{ r.cardVal }}</b></div>
                </div>
                <svg class="spark-linha" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" x2="100" y1="{{ r.sparkZero }}" y2="{{ r.sparkZero }}" style="stroke:var(--axis);stroke-width:1;vector-effect:non-scaling-stroke"></line><polyline points="{{ r.spark }}" style="fill:none;stroke:{{ r.sparkColor }};stroke-width:2;vector-effect:non-scaling-stroke"></polyline></svg>
                <div class="cartao-rodape"><span class="pill" style="color:{{ r.statusFg }};background:{{ r.statusBg }}">{{ r.status }}</span><span class="decisao" style="color:{{ r.markFg }}"><span class="dot" style="background:{{ r.markDot }}"></span>{{ r.mark }}</span></div>
              </button>
            </sc-for>
            <div class="cartao-total"><span>Total · {{ total.cardLabel }}</span><b class="num" style="color:{{ total.cardFg }}">{{ total.cardVal }}</b></div>
          </div>
        </sc-if>

        <sc-if value="{{ emptyFilter }}"><p>Nenhuma conta negativa neste cenário.</p></sc-if>
        <span class="nota">Clique numa conta para ver o detalhe, ou num dia (gráfico ou cabeçalho) para focar. Valores em {{ unitLabel }}. Fonte: aba “Resumo CFO”.</span>
      </section>

      <!-- ===================== simulação ===================== -->
      <section class="card">
        <div class="card-topo">
          <div class="linha-h">
            <h2>Simular transferência entre contas</h2>
            <sc-if value="{{ hasTransfers }}"><span class="badge">{{ nTransfers }} ativa(s)</span></sc-if>
          </div>
          <button class="btn btn-ghost" onClick="{{ toggleSim }}">{{ simToggleLabel }}</button>
        </div>
        <sc-if value="{{ simOpen }}">
          <div class="sim">
            <span class="sub">Teste a cobertura antes de decidir. A simulação não altera a planilha.</span>
            <div class="sim-grade">
              <label class="rotulo-campo">Origem
                <select class="campo" value="{{ simFrom }}" onChange="{{ onSimFrom }}">
                  <sc-for list="{{ acctOptions }}" as="o"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
                </select>
              </label>
              <label class="rotulo-campo">Destino
                <select class="campo" value="{{ simTo }}" onChange="{{ onSimTo }}">
                  <sc-for list="{{ acctOptions }}" as="o"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
                </select>
              </label>
              <label class="rotulo-campo">Valor (R$)
                <input class="campo" type="text" inputMode="decimal" placeholder="Ex.: 500.000" value="{{ simAmount }}" onChange="{{ onSimAmount }}">
              </label>
              <label class="rotulo-campo">A partir de
                <select class="campo" value="{{ simStart }}" onChange="{{ onSimStart }}">
                  <sc-for list="{{ startOptions }}" as="o"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
                </select>
              </label>
              <button class="btn btn-primario" onClick="{{ addTransfer }}">Adicionar</button>
            </div>
            <sc-if value="{{ simError }}"><span class="aviso-texto">{{ simErrorText }}</span></sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ hasTransfers }}">
          <div class="lista">
            <sc-for list="{{ transfersList }}" as="t">
              <div class="lista-linha"><span class="flex1">{{ t.txt }}</span><button class="btn btn-link" onClick="{{ t.onRemove }}">Remover</button></div>
            </sc-for>
          </div>
          <div class="card-rodape">
            <div class="meta">
              <span>Contas negativas ({{ scLabel }}) <b>{{ simSummary.neg }}</b></span>
              <span>Pior saldo ({{ scLabel }}) <b>{{ simSummary.worst }}</b></span>
            </div>
            <button class="btn btn-ghost" onClick="{{ clearSim }}">Limpar simulação</button>
          </div>
        </sc-if>
      </section>
    </sc-if>
  </main>

  <footer class="rodape">
    <div class="wrap rodape-in">
      <span><b>RSM Brasil</b> · Auditoria, Consultoria e Impostos · Referência {{ refDate }} · uso interno · {{ modoLabel }}</span>
      <span class="atalhos">Atalhos <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> cenários <kbd>N</kbd> negativas <kbd>S</kbd> sugerir <kbd>B</kbd> insights <kbd>P</kbd> apresentar <kbd>Esc</kbd> fechar</span>
    </div>
  </footer>

  <!-- ===================== detalhe da conta ===================== -->
  <sc-if value="{{ hasDetail }}">
    <div class="veu" onClick="{{ closeDetail }}"></div>
    <aside class="gaveta">
      <div class="card-topo">
        <div>
          <span class="sub">Conta {{ detail.pos }}</span>
          <h2 class="gaveta-titulo">{{ detail.bank }}</h2>
          <span class="sub">{{ detail.acct }}</span>
        </div>
        <div class="linha-h">
          <button class="btn btn-ghost btn-icone" onClick="{{ prevAcct }}" title="Anterior (↑)">↑</button>
          <button class="btn btn-ghost btn-icone" onClick="{{ nextAcct }}" title="Próxima (↓)">↓</button>
          <button class="btn btn-ghost btn-icone" onClick="{{ closeDetail }}" title="Fechar (Esc)">×</button>
        </div>
      </div>
      <div class="gaveta-kpis">
        <div><span class="kpi-rotulo">Saldo hoje</span><b class="num">{{ detail.today }}</b></div>
        <div><span class="kpi-rotulo">Pior · com receb.</span><b class="num" style="color:{{ detail.min1Color }}">{{ detail.min1 }}</b><small>{{ detail.neg1 }}</small></div>
        <div><span class="kpi-rotulo">Pior · só saídas</span><b class="num" style="color:{{ detail.min2Color }}">{{ detail.min2 }}</b><small>{{ detail.neg2 }}</small></div>
      </div>
      <svg class="grafico" viewBox="0 0 880 220">
        <sc-for list="{{ detail.chart.ticks }}" as="t">
          <line x1="90" x2="865" y1="{{ t.y }}" y2="{{ t.y }}" style="stroke:{{ t.stroke }};stroke-width:1"></line>
          <text x="80" y="{{ t.ty }}" text-anchor="end" class="eixo eixo-g">{{ t.label }}</text>
        </sc-for>
        <polygon points="{{ detail.chart.a1 }}" style="fill:var(--c1);fill-opacity:.10"></polygon>
        <polyline points="{{ detail.chart.c2 }}" style="fill:none;stroke:var(--c2);stroke-width:3;stroke-linejoin:round;stroke-dasharray:8 6"></polyline>
        <polyline points="{{ detail.chart.c1 }}" style="fill:none;stroke:var(--c1);stroke-width:3;stroke-linejoin:round"></polyline>
        <sc-for list="{{ detail.chart.pts }}" as="p">
          <text x="{{ p.x }}" y="{{ p.ly }}" text-anchor="middle" class="eixo eixo-g">{{ p.label }}</text>
        </sc-for>
      </svg>
      <div class="legenda"><span><span class="chave chave-c1"></span>Com recebimentos</span><span><span class="chave chave-c2"></span>Só saídas</span></div>
      <div class="lista">
        <sc-for list="{{ detail.days }}" as="x">
          <div class="dia-linha num"><span class="tx2">{{ x.label }}</span><span style="color:{{ x.c1 }}">{{ x.v1 }}</span><span style="color:{{ x.c2 }}">{{ x.v2 }}</span></div>
        </sc-for>
      </div>
      <div class="decisao-bloco">
        <span class="kpi-rotulo">Decisão do CFO</span>
        <div class="linha-h">
          <sc-for list="{{ detail.marks }}" as="m">
            <button class="chip chip-grande" onClick="{{ m.onClick }}" style="color:{{ m.fg }};background:{{ m.bg }}">{{ m.label }}</button>
          </sc-for>
        </div>
        <textarea class="campo" value="{{ detail.note }}" onChange="{{ detail.onNote }}" placeholder="Observação (opcional)" rows="3"></textarea>
        <span class="nota">Salvo neste navegador.</span>
      </div>
    </aside>
  </sc-if>

  <sc-if value="{{ dragging }}">
    <div class="soltar"><span>Solte a planilha para carregar</span></div>
  </sc-if>

  <div class="tema-escuro">
  <sc-if value="{{ present }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:60;background:#00153D;display:flex;flex-direction:column;padding:clamp(16px,3vw,40px) clamp(16px,5vw,72px)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="display:flex;gap:3px;height:16px;align-items:flex-end"><span style="width:4px;height:8px;background:#888b8d;border-radius:1px"></span><span style="width:4px;height:12px;background:#3f9c35;border-radius:1px"></span><span style="width:4px;height:16px;background:#009cde;border-radius:1px"></span></div>
          <span style="font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#ffffff;font-weight:700">RSM Brasil</span>
          <span style="font-size:13px;color:#888b8d">Resumo CFO · {{ refDate }}</span>
        </div>
        <button onClick="{{ stopPresent }}" style="border:none;background:rgba(255,255,255,0.06);color:#ffffff;padding:8px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer" style-hover="background:rgba(255,255,255,0.12)">Sair <kbd>Esc</kbd></button>
      </div>

      <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:24px 0">
        <sc-if value="{{ pv.s0 }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:clamp(20px,3vw,40px);max-width:1280px;width:100%;margin:0 auto">
            <span style="font-size:clamp(14px,1.4vw,18px);letter-spacing:0.14em;text-transform:uppercase;color:#009cde">01 · Posição de caixa</span>
            <div style="display:flex;flex-wrap:wrap;gap:24px 64px;align-items:flex-end">
              <div style="display:flex;flex-direction:column;gap:8px">
                <span style="font-size:clamp(16px,1.6vw,22px);color:#cccfcf">Saldo consolidado hoje</span>
                <span style="font-size:clamp(48px,8vw,112px);font-weight:300;letter-spacing:-0.03em;line-height:1;color:#ffffff;font-variant-numeric:tabular-nums">{{ kpi.today }}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:24px 48px">
                <div style="display:flex;flex-direction:column;gap:6px">
                  <span style="font-size:clamp(14px,1.3vw,18px);color:#cccfcf">{{ endLabel }} · com recebimentos</span>
                  <span style="font-size:clamp(28px,3.2vw,44px);font-weight:700;color:{{ kpi.c1Color }};font-variant-numeric:tabular-nums">{{ kpi.c1End }}</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px">
                  <span style="font-size:clamp(14px,1.3vw,18px);color:#cccfcf">{{ endLabel }} · só saídas</span>
                  <span style="font-size:clamp(28px,3.2vw,44px);font-weight:700;color:{{ kpi.c2Color }};font-variant-numeric:tabular-nums">{{ kpi.c2End }}</span>
                </div>
              </div>
            </div>
            <svg viewBox="0 0 880 250" style="width:100%;max-height:42vh;display:block;font-family:inherit">
              <sc-for list="{{ chart.ticks }}" as="t" hint-placeholder-count="0">
                <line x1="90" x2="865" y1="{{ t.y }}" y2="{{ t.y }}" stroke="{{ t.stroke }}" stroke-width="1"></line>
                <text x="80" y="{{ t.ty }}" text-anchor="end" font-size="13" fill="#888b8d">{{ t.label }}</text>
              </sc-for>
              <polyline points="{{ chart.c1 }}" fill="none" stroke="#009cde" stroke-width="3.5" stroke-linejoin="round"></polyline>
              <polyline points="{{ chart.c2 }}" fill="none" stroke="#3f9c35" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="8 6"></polyline>
              <sc-for list="{{ chart.pts }}" as="p" hint-placeholder-count="0">
                <text x="{{ p.x }}" y="{{ p.ly }}" text-anchor="middle" font-size="13" fill="#888b8d">{{ p.label }}</text>
              </sc-for>
            </svg>
          </div>
        </sc-if>

        <sc-if value="{{ pv.s1 }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:clamp(20px,3vw,36px);max-width:1280px;width:100%;margin:0 auto">
            <span style="font-size:clamp(14px,1.4vw,18px);letter-spacing:0.14em;text-transform:uppercase;color:#ff6b8f">02 · Risco de cobertura · cenário só saídas</span>
            <h2 style="margin:0;font-size:clamp(32px,4.6vw,64px);font-weight:300;line-height:1.1;letter-spacing:-0.02em;color:#ffffff;text-wrap:pretty">{{ att.negAccounts }} de {{ nAccounts }} contas ficam negativas sem recebimentos.</h2>
            <div style="display:flex;flex-direction:column">
              <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr);gap:20px;padding:0 0 10px;font-size:clamp(12px,1.1vw,15px);color:#888b8d;border-bottom:1px solid rgba(255,255,255,0.12)">
                <span>Conta</span><span>Cobertura</span><span style="text-align:right">Pior · com receb.</span><span style="text-align:right">Pior · só saídas</span>
              </div>
              <sc-for list="{{ negList }}" as="r" hint-placeholder-count="5">
                <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr);gap:20px;align-items:center;padding:clamp(10px,1.4vw,18px) 0;border-bottom:1px solid rgba(255,255,255,0.06)">
                  <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
                    <span style="font-size:clamp(16px,1.6vw,22px);color:#ffffff">{{ r.bank }}</span>
                    <span style="font-size:clamp(12px,1.1vw,14px);color:#888b8d">{{ r.acct }}</span>
                  </div>
                  <div style="display:flex;gap:4px">
                    <sc-for list="{{ r.segs }}" as="s" hint-placeholder-count="7">
                      <span style="flex:1;height:10px;border-radius:3px;background:{{ s.bg }}"></span>
                    </sc-for>
                  </div>
                  <span style="text-align:right;font-size:clamp(15px,1.6vw,22px);font-variant-numeric:tabular-nums;color:{{ r.w1c }}">{{ r.w1 }}</span>
                  <span style="text-align:right;font-size:clamp(15px,1.6vw,22px);font-weight:700;font-variant-numeric:tabular-nums;color:{{ r.w2c }}">{{ r.w2 }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ pv.s2 }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:clamp(20px,3vw,36px);max-width:1280px;width:100%;margin:0 auto">
            <span style="font-size:clamp(14px,1.4vw,18px);letter-spacing:0.14em;text-transform:uppercase;color:#3f9c35">03 · Recomendação · cenário só saídas</span>
            <h2 style="margin:0;font-size:clamp(30px,4.2vw,58px);font-weight:300;line-height:1.1;letter-spacing:-0.02em;color:#ffffff;text-wrap:pretty">{{ psug.headline }}</h2>
            <div style="display:flex;flex-wrap:wrap;gap:24px 64px">
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:clamp(14px,1.3vw,18px);color:#cccfcf">Contas negativas</span>
                <span style="font-size:clamp(32px,4vw,56px);font-weight:300;color:#ffffff;font-variant-numeric:tabular-nums">{{ psug.before }} → {{ psug.after }}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:clamp(14px,1.3vw,18px);color:#cccfcf">Transferências internas</span>
                <span style="font-size:clamp(32px,4vw,56px);font-weight:300;color:#ffffff;font-variant-numeric:tabular-nums">{{ psug.total }}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <span style="font-size:clamp(14px,1.3vw,18px);color:#cccfcf">Necessidade de aporte</span>
                <span style="font-size:clamp(32px,4vw,56px);font-weight:700;color:{{ psug.gapColor }};font-variant-numeric:tabular-nums">{{ psug.gap }}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column">
              <sc-for list="{{ psug.list }}" as="t" hint-placeholder-count="0">
                <div style="display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:clamp(15px,1.5vw,20px)">
                  <span style="font-weight:700;color:#ffffff;font-variant-numeric:tabular-nums;min-width:170px">{{ t.amount }}</span>
                  <span style="color:#cccfcf">{{ t.from }}</span>
                  <span style="color:#009cde">→</span>
                  <span style="color:#ffffff">{{ t.to }}</span>
                </div>
              </sc-for>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:clamp(13px,1.2vw,16px)">
              <span style="padding:6px 14px;border-radius:999px;background:rgba(63,156,53,0.2);color:#ffffff">OK {{ tally.ok }}</span>
              <span style="padding:6px 14px;border-radius:999px;background:rgba(0,156,222,0.2);color:#ffffff">Transferir {{ tally.tr }}</span>
              <span style="padding:6px 14px;border-radius:999px;background:rgba(241,180,52,0.2);color:#ffffff">Verificar {{ tally.ver }}</span>
              <span style="padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.08);color:#cccfcf">Pendentes {{ tally.pend }}</span>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
        <button onClick="{{ prevStep }}" style="border:none;background:rgba(255,255,255,0.06);color:#ffffff;padding:10px 18px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;opacity:{{ pv.prevOp }}" style-hover="background:rgba(255,255,255,0.12)">← Anterior</button>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ pv.dots }}" as="d" hint-placeholder-count="3">
            <button onClick="{{ d.onClick }}" style="border:none;padding:0;height:8px;border-radius:4px;cursor:pointer;transition:width .25s,background-color .25s;width:{{ d.w }};background:{{ d.bg }}"></button>
          </sc-for>
        </div>
        <button onClick="{{ nextStep }}" style="border:none;background:#009cde;color:#ffffff;padding:10px 18px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer" style-hover="background:#006e9d">{{ pv.nextLabel }}</button>
      </div>
    </div>
  </sc-if>
  </div>
</div>
</script>

  // minigráfico: série → pontos "x,y" num quadro 0..w × 0..h (com zero opcional)
  sparkPts(vals, w, h, comZero) {
    const a = comZero ? [...vals, 0] : vals;
    const mn = Math.min(...a), mx = Math.max(...a), r = mx - mn || 1, n = Math.max(vals.length - 1, 1);
    const Y = v => (2 + (h - 4) * (mx - v) / r).toFixed(1);

  }
  // valores extras do v7: ponte do saldo, saldo por banco, minigráficos
  v7Vals(d, all, T, n, rows, sc) {
    const fim1 = n ? T.c1[n - 1] : T.today, fim2 = n ? T.c2[n - 1] : T.today;
    const saidas = fim2 - T.today, receb = fim1 - fim2;
    // ponte: barras posicionadas numa escala comum (0..max dos acumulados)
    const passos = [
      { label: 'Saldo hoje', de: 0, ate: T.today, cor: 'var(--muted)' },
      { label: 'Saídas', de: T.today, ate: T.today + saidas, cor: 'var(--neg)' },
      { label: 'Recebimentos', de: T.today + saidas, ate: fim1, cor: 'var(--pos)' },
      { label: 'Saldo em ' + (n ? d.dates[n - 1].slice(4, 9) : ''), de: 0, ate: fim1, cor: 'var(--accent)' }
    ];
    const lo = Math.min(0, ...passos.map(p => Math.min(p.de, p.ate))), hi = Math.max(1, ...passos.map(p => Math.max(p.de, p.ate)));
    const pct = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + '%';
    const ponte = passos.map((p, i) => ({
      label: p.label, color: p.cor, left: pct(Math.min(p.de, p.ate)),
      width: (Math.abs(p.ate - p.de) / (hi - lo) * 100).toFixed(2) + '%',
      txt: (i === 1 || i === 2) ? ((p.ate - p.de) >= 0 ? '+' : '−') + this.compact(p.ate - p.de) : this.compact(p.ate),
      ink: (i === 1) ? 'var(--neg-ink)' : (i === 2) ? 'var(--pos-ink)' : (p.ate < -0.5 ? 'var(--neg-ink)' : 'var(--ink)')
    }));
    // saldo hoje por banco
    const porBanco = {};
    all.forEach(a => { porBanco[a[0]] = (porBanco[a[0]] || 0) + a[2]; });
    const tot = Object.values(porBanco).reduce((t, v) => t + Math.max(v, 0), 0) || 1;
    const bancos = Object.entries(porBanco).sort((x, y) => y[1] - x[1]).map(([b, v]) => ({
      label: b, txt: this.compact(v), pct: Math.round(Math.max(v, 0) / tot * 100) + '%', width: (Math.max(v, 0) / tot * 100).toFixed(1) + '%'
    }));
    // minigráfico por conta (cenário ativo, incluindo hoje)
    rows.forEach(r => {

    });

      { label: 'Menor saldo · só saídas', txt: this.money(m2.v), sub: m2.i >= 0 ? 'em ' + d.dates[m2.i] : '', ink: m2.v < -0.5 ? 'var(--neg-ink)' : 'var(--ink)' },
      { label: 'Recebimentos no período', txt: this.money(receb), sub: 'diferença entre os cenários em ' + (n ? d.dates[n - 1].slice(4, 9) : ''), ink: 'var(--ink)' }
    ];

  buildBrief(d, minV) {

    else {

    }

    const blocks = [];

      const k = a => a[0] + '|' + a[1];

      if (!novas.length && !sairam.length) mud.push('Nenhuma conta mudou de situação.');
    } else mud.push('Primeira carga registrada neste navegador. A partir da próxima, mostro o que mudou de um dia para o outro.');
    blocks.push({ title: 'O que mudou', color: 'var(--accent)', lines: mud });

    // ---- 2. riscos (Cenário 2: só saídas)

<script>
/* =====================================================================
   dc-runtime — mini motor de templates para rodar o Resumo CFO sem
   dependências externas (substitui o support.js do formato .dc.html).

   Suporta o mesmo dialeto do v4:
   - {{ caminho.do.valor }} em texto e atributos
   - <sc-if value="{{ x }}"> … </sc-if>
   - <sc-for list="{{ lista }}" as="item"> … </sc-for>
   - onClick / onChange / onMouseEnter / onMouseLeave="{{ funcao }}"
   - style-hover="css aplicado no :hover"
   - value="{{ x }}" em input, textarea e select
   A tela é recalculada a cada setState e aplicada com morphdom
   (só o que mudou é atualizado; foco e cursor dos campos são preservados).
   ===================================================================== */
(function () {
  'use strict';

  // ---------------------------------------------------------------- componente base
  let agendado = false, componente = null, raiz = null, modelo = null;
  const handlers = new Map();      // id → função (refeito a cada render)
  const classesHover = new Map();  // css do hover → nome da classe
  let folhaHover = null;

  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(upd) {
      const parcial = typeof upd === 'function' ? upd(this.state) : upd;
      if (parcial) this.state = Object.assign({}, this.state, parcial);
      agendar();
    }
  }
  window.DCLogic = DCLogic;

  function agendar() {
    if (agendado || !componente) return;
    agendado = true;
    queueMicrotask(() => { agendado = false; renderizar(); });
  }

  // ---------------------------------------------------------------- avaliação de expressões
  const RX = /\{\{\s*([^}]+?)\s*\}\}/g;
  function resolver(caminho, escopo) {
    let v = escopo;
    for (const parte of caminho.split('.')) {
      if (v == null) return undefined;
      v = v[parte];
    }
    return v;
  }
  // "{{ x }}" isolado devolve o valor bruto (função, lista, booleano…)
  function valorBruto(txt, escopo) {
    const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(txt || '');
    return m ? resolver(m[1], escopo) : txt;
  }
  function interpolar(txt, escopo) {
    return txt.replace(RX, (_, p) => { const v = resolver(p, escopo); return v == null ? '' : String(v); });
  }

  function classeHover(css) {
    if (!classesHover.has(css)) {
      const nome = 'dch' + classesHover.size;
      classesHover.set(css, nome);
      const regras = css.split(';').filter(s => s.trim()).map(s => s.trim() + ' !important').join(';');
      folhaHover.sheet.insertRule('.' + nome + ':hover{' + regras + '}', folhaHover.sheet.cssRules.length);
    }
    return classesHover.get(css);
  }

  let seq = 0;
  function registrar(fn) { const id = 'h' + (seq++); handlers.set(id, fn); return id; }

  // ---------------------------------------------------------------- render recursivo
  function filhos(no) { return no.content ? no.content.childNodes : no.childNodes; }

  function montar(nos, escopo, destino) {
    for (const no of nos) {
      if (no.nodeType === 3) { destino.appendChild(document.createTextNode(interpolar(no.nodeValue, escopo))); continue; }
      if (no.nodeType !== 1) continue;
      const tag = no.localName;
      if (tag === 'template' && no.hasAttribute('data-sc-if')) {
        if (valorBruto(no.getAttribute('data-sc-if'), escopo)) montar(filhos(no), escopo, destino);
        continue;
      }
      if (tag === 'template' && no.hasAttribute('data-sc-for')) {
        const lista = valorBruto(no.getAttribute('data-sc-for'), escopo) || [];
        const nome = no.getAttribute('data-as');
        lista.forEach(item => { const s = Object.create(escopo); s[nome] = item; montar(filhos(no), s, destino); });
        continue;
      }
      const el = document.createElementNS(no.namespaceURI, no.localName);
      let valor = null;
      for (const at of no.attributes) {
        const n = at.name, v = at.value;
        if (n.startsWith('hint-')) continue;
        if (n === 'style-hover') { el.classList.add(classeHover(v)); continue; }
        if (/^on[a-z]+$/.test(n)) {
          const fn = valorBruto(v, escopo);
          if (typeof fn === 'function') el.setAttribute('data-dc-' + n, registrar(fn));
          continue;
        }
        if (n === 'value' && (tag === 'select' || tag === 'textarea')) { valor = interpolar(v, escopo); continue; }
        el.setAttribute(n, interpolar(v, escopo));
      }
      if (el.classList.length === 0) el.removeAttribute('class');
      montar(filhos(no), escopo, el);
      if (tag === 'textarea' && valor != null) el.textContent = valor;
      if (tag === 'select' && valor != null)
        for (const op of el.options) { if (op.value === valor) op.setAttribute('selected', ''); else op.removeAttribute('selected'); }
      destino.appendChild(el);
    }
  }

  function renderizar() {
    handlers.clear();
    const vals = componente.renderVals();
    const novo = document.createElement('div');
    novo.id = 'dc-raiz';
    montar(modelo, vals, novo);
    window.morphdom(raiz, novo, {
      onBeforeElUpdated(de, para) {
        // campo com foco: não sobrescreve o que o usuário está digitando
        if (de === document.activeElement && (de.tagName === 'INPUT' || de.tagName === 'TEXTAREA')) para.value = de.value;
        return !de.isEqualNode(para);
      }
    });
    if (componente._montado && componente.componentDidUpdate) componente.componentDidUpdate();
  }

  // ---------------------------------------------------------------- eventos delegados
  function disparar(tipo, e, alvo) {
    for (let el = alvo; el && el !== raiz.parentNode; el = el.parentNode) {
      const id = el.getAttribute && el.getAttribute('data-dc-' + tipo);
      if (id && handlers.has(id)) {
        handlers.get(id)(e);
        if (e.cancelBubble) break;
      }
    }
  }
  function ligarEventos() {
    raiz.addEventListener('click', e => disparar('onclick', e, e.target));
    // React: onChange de texto dispara a cada tecla; select/arquivo no change
    raiz.addEventListener('input', e => { if (e.target.type !== 'file' && e.target.tagName !== 'SELECT') disparar('onchange', e, e.target); });
    raiz.addEventListener('change', e => { if (e.target.type === 'file' || e.target.tagName === 'SELECT') disparar('onchange', e, e.target); });
    raiz.addEventListener('mouseover', e => {
      for (let el = e.target; el && el !== raiz; el = el.parentNode) {
        const id = el.getAttribute && el.getAttribute('data-dc-onmouseenter');
        if (id && !(e.relatedTarget && el.contains(e.relatedTarget)) && handlers.has(id)) handlers.get(id)(e);
      }
    });
    raiz.addEventListener('mouseout', e => {
      for (let el = e.target; el && el !== raiz; el = el.parentNode) {
        const id = el.getAttribute && el.getAttribute('data-dc-onmouseleave');
        if (id && !(e.relatedTarget && el.contains(e.relatedTarget)) && handlers.has(id)) handlers.get(id)(e);
      }
    });
  }

  // ---------------------------------------------------------------- inicialização
  function iniciar() {
    // guarda o HTML original (antes de qualquer render) para o "Baixar painel com dados"
    window.__HTML_ORIGINAL__ = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    folhaHover = document.createElement('style');
    document.head.appendChild(folhaHover);

    // template: sc-if/sc-for viram <template> para o parser HTML aceitar
    // dentro de <tbody>, <select> e <svg> sem reordenar os elementos
    const bruto = document.getElementById('dc-template').textContent
      .replace(/<sc-if\s+value="([^"]*)"[^>]*>/g, '<template data-sc-if="$1">')
      .replace(/<sc-for\s+list="([^"]*)"\s+as="([^"]*)"[^>]*>/g, '<template data-sc-for="$1" data-as="$2">')
      .replace(/<\/sc-(if|for)>/g, '</template>');
    const t = document.createElement('template');
    t.innerHTML = bruto;
    modelo = Array.from(t.content.childNodes);

    // props: valores padrão declarados em data-props
    const script = document.querySelector('script[data-dc-script]');
    const decl = JSON.parse(script.getAttribute('data-props') || '{}');
    const props = {};
    Object.keys(decl).forEach(k => { props[k] = decl[k].default; });
    const Component = new Function('DCLogic', script.textContent + '\nreturn Component;')(DCLogic);

    raiz = document.createElement('div');
    raiz.id = 'dc-raiz';
    document.body.appendChild(raiz);
    ligarEventos();
    componente = new Component(props);
    renderizar();
    componente._montado = true;
    if (componente.componentDidMount) componente.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>


</body></html>
